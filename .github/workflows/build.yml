name: Bunny Models - Build APK Standalone

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build-android:
    name: Build APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ============================================================
      # BAIXA O REPOSITÓRIO
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v5


      # ============================================================
      # JAVA / ANDROID
      # ============================================================

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # NODE
      # ============================================================

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"


      # ============================================================
      # VERIFICA APP.JS
      # ============================================================

      - name: Check App.js
        shell: bash
        run: |
          if [ ! -f "App.js" ]; then
            echo "ERRO: App.js não encontrado na raiz."
            exit 1
          fi

          echo "App.js encontrado."
          wc -l App.js


      # ============================================================
      # CRIA PACKAGE.JSON
      # ============================================================

      - name: Create package.json
        shell: bash
        run: |
          cat > package.json <<'EOF'
          {
            "name": "bunny-models",
            "version": "1.0.0",
            "private": true,
            "main": "node_modules/expo/AppEntry.js",
            "scripts": {
              "start": "expo start",
              "android": "expo start --android"
            },
            "dependencies": {
              "@expo/vector-icons": "^15.0.0",
              "@react-native-async-storage/async-storage": "2.2.0",
              "expo": "~57.0.0",
              "react": "19.2.3",
              "react-native": "0.86.3"
            }
          }
          EOF


      # ============================================================
      # CONFIGURA O APP
      # ============================================================

      - name: Create app.json
        shell: bash
        run: |
          cat > app.json <<'EOF'
          {
            "expo": {
              "name": "Bunny Models",
              "slug": "bunny-models",
              "version": "1.0.0",

              "orientation": "portrait",

              "userInterfaceStyle": "light",

              "android": {
                "package": "com.bunnymodels.app",
                "versionCode": 1
              }
            }
          }
          EOF


      # ============================================================
      # INSTALA DEPENDÊNCIAS
      # ============================================================

      - name: Install dependencies
        run: npm install


      # ============================================================
      # CORRIGE VERSÕES DO EXPO
      # ============================================================

      - name: Fix Expo dependencies
        run: npx expo install --fix


      - name: Check Expo dependencies
        run: npx expo install --check


      # ============================================================
      # GERA PROJETO ANDROID NATIVO
      # ============================================================

      - name: Generate Android project
        env:
          CI: "1"
        run: |
          npx expo prebuild \
            --platform android \
            --clean


      # ============================================================
      # VERIFICA O ANDROID
      # ============================================================

      - name: Check Android project
        shell: bash
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "ERRO: android/gradlew não encontrado."
            exit 1
          fi

          echo "Projeto Android criado."


      # ============================================================
      # PERMISSÃO DO GRADLE
      # ============================================================

      - name: Make Gradle executable
        run: chmod +x android/gradlew


      # ============================================================
      # CACHE / CONFIG GRADLE
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4


      # ============================================================
      # BUILD RELEASE
      #
      # IMPORTANTE:
      # assembleRelease empacota o JavaScript dentro do APK.
      # Não depende do Metro.
      # ============================================================

      - name: Build Standalone Release APK
        working-directory: android
        env:
          CI: "1"
        run: |
          ./gradlew clean
          ./gradlew assembleRelease --no-daemon --stacktrace


      # ============================================================
      # PROCURA APK
      # ============================================================

      - name: Find APK
        shell: bash
        run: |
          echo "======================================"
          echo "APKs GERADOS:"
          echo "======================================"

          find android/app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          echo "======================================"


      # ============================================================
      # COPIA PARA NOME MAIS BONITO
      # ============================================================

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p output

          APK=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK release não encontrado."
            exit 1
          fi

          cp "$APK" output/BunnyModels.apk

          echo "APK preparado:"
          ls -lh output/BunnyModels.apk


      # ============================================================
      # ENVIA PARA O GITHUB ACTIONS
      # ============================================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BunnyModels-Android
          path: output/BunnyModels.apk
          if-no-files-found: error
          retention-days: 30
