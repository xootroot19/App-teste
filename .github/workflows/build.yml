name: Bunny Models - Build Android

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build-android:
    name: Build APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Create package.json
        shell: bash
        run: |
          cat > package.json <<'EOF'
          {
            "name": "bunny-models",
            "version": "1.0.0",
            "private": true,
            "main": "node_modules/expo/AppEntry.js",
            "scripts": {
              "start": "expo start",
              "android": "expo start --android",
              "doctor": "expo-doctor"
            },
            "dependencies": {
              "@expo/vector-icons": "^15.0.0",
              "@react-native-async-storage/async-storage": "2.2.0",
              "expo": "~57.0.0",
              "react": "19.2.3",
              "react-native": "0.86.3"
            }
          }
          EOF

      - name: Create app.json
        shell: bash
        run: |
          cat > app.json <<'EOF'
          {
            "expo": {
              "name": "Bunny Models",
              "slug": "bunny-models",
              "version": "1.0.0",
              "orientation": "portrait",
              "userInterfaceStyle": "light",
              "android": {
                "package": "com.bunnymodels.app",
                "versionCode": 1
              },
              "ios": {
                "bundleIdentifier": "com.bunnymodels.app",
                "buildNumber": "1"
              }
            }
          }
          EOF

      - name: Create eas.json
        shell: bash
        run: |
          cat > eas.json <<'EOF'
          {
            "cli": {
              "version": ">= 16.0.0"
            },
            "build": {
              "preview": {
                "distribution": "internal",
                "android": {
                  "buildType": "apk"
                }
              },
              "production": {
                "autoIncrement": true,
                "android": {
                  "buildType": "app-bundle"
                }
              }
            }
          }
          EOF

      - name: Check App.js
        shell: bash
        run: |
          if [ ! -f "App.js" ]; then
            echo "ERRO: App.js não encontrado na raiz do repositório."
            exit 1
          fi

          echo "App.js encontrado."
          wc -l App.js

      - name: Install dependencies
        run: npm install

      - name: Fix Expo dependencies
        run: npx expo install --fix

      - name: Setup Expo / EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Versions
        shell: bash
        run: |
          node --version
          npm --version
          eas --version
          npx expo --version

      - name: Expo dependency check
        run: npx expo install --check

      - name: Show Expo config
        run: npx expo config --type public

      - name: Build APK
        run: |
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --no-wait
