name: Bunny Models - Build APK

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  build-android:
    name: Build APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # Baixa os arquivos do repositório
      - name: Checkout
        uses: actions/checkout@v5

      # Java necessário para o Gradle / Android
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      # Garante que o App.js existe
      - name: Check App.js
        shell: bash
        run: |
          if [ ! -f "App.js" ]; then
            echo "ERRO: App.js não encontrado na raiz do repositório."
            exit 1
          fi

          echo "App.js encontrado:"
          wc -l App.js

      # Cria package.json durante a build
      - name: Create package.json
        shell: bash
        run: |
          cat > package.json <<'EOF'
          {
            "name": "bunny-models",
            "version": "1.0.0",
            "private": true,
            "main": "node_modules/expo/AppEntry.js",
            "scripts": {
              "start": "expo start",
              "android": "expo start --android"
            },
            "dependencies": {
              "@expo/vector-icons": "^15.0.0",
              "@react-native-async-storage/async-storage": "2.2.0",
              "expo": "~57.0.0",
              "react": "19.2.3",
              "react-native": "0.86.3"
            }
          }
          EOF

      # Configuração do aplicativo
      - name: Create app.json
        shell: bash
        run: |
          cat > app.json <<'EOF'
          {
            "expo": {
              "name": "Bunny Models",
              "slug": "bunny-models",
              "version": "1.0.0",
              "orientation": "portrait",
              "userInterfaceStyle": "light",
              "android": {
                "package": "com.bunnymodels.app",
                "versionCode": 1
              }
            }
          }
          EOF

      # Instala dependências
      - name: Install dependencies
        run: npm install

      # Ajusta automaticamente versões compatíveis com o Expo
      - name: Fix Expo dependencies
        run: npx expo install --fix

      # Validação
      - name: Check Expo dependencies
        run: npx expo install --check

      # Gera o projeto Android nativo
      # NÃO usa EAS e NÃO precisa de EXPO_TOKEN
      - name: Generate Android project
        env:
          CI: "1"
        run: |
          npx expo prebuild \
            --platform android \
            --clean

      # Mostra se a estrutura Android foi realmente criada
      - name: Check Android project
        shell: bash
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "ERRO: android/gradlew não foi gerado."
            exit 1
          fi

          echo "Projeto Android criado com sucesso."
          ls -la android

      # Permissão para executar Gradle
      - name: Make Gradle executable
        run: chmod +x android/gradlew

      # Cache do Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Compila APK instalável
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # Confere o APK
      - name: Find APK
        shell: bash
        run: |
          echo "APKs encontrados:"
          find android/app/build/outputs/apk -type f -name "*.apk" -print

      # Salva o APK nos Artifacts do GitHub
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bunny-models-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
