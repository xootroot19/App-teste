plugins { id 'com.android.application' }

android {
    namespace 'com.xootroot.ps2devkitsim'
    compileSdk 35

    defaultConfig {
        applicationId 'com.xootroot.ps2devkitsim'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
        externalNativeBuild {
            cmake { cppFlags '-std=c++20' }
        }
    }

    externalNativeBuild {
        cmake { path file('../CMakeLists.txt'); version '3.22.1' }
    }
}
